name: IGAE mensual

# Qué hace: baja el CSV del IGAE de INEGI cuando sale un mes nuevo, genera el reporte Word,
# reconstruye el dashboard (docs/) y lo guarda en el repositorio. GitHub Pages publica docs/.

on:
  schedule:
    # Todos los días 19 al 28 a las 15:00 UTC (9:00 en Guadalajara). INEGI publica el IGAE entre el 22 y
    # el 25 de cada mes; fetch_inegi.py --solo-ventana solo consulta INEGI de 2 días antes a 2 días
    # después de la fecha de su calendario (calendario_igae.json). Los demás días termina en segundos.
    - cron: '0 15 19-28 * *'
  workflow_dispatch:           # botón "Run workflow" en la pestaña Actions
    inputs:
      meses_atras:
        description: 'Cuántos meses de reportes mantener (24 = últimos 2 años)'
        required: false
        default: '24'
      regenerar_todo:
        description: 'Regenerar TODOS los reportes (usa los datos más recientes de INEGI)'
        type: boolean
        required: false
        default: false
      reenviar_aviso:
        description: 'Reenviar el correo de aviso del mes más reciente a los suscriptores'
        type: boolean
        required: false
        default: false
      correo_prueba:
        description: 'Enviar un correo de prueba (solo al dueño del script de avisos)'
        type: boolean
        required: false
        default: false
      url_csv:
        description: 'URL del .zip/.csv de INEGI (opcional; si se llena, se usa en lugar de la URL por defecto)'
        required: false
        default: ''
  push:
    paths:
      - 'data/*.csv'           # si subes un CSV a mano, también se regenera todo

permissions:
  contents: write              # para que el bot pueda hacer commit de docs/ y data/

concurrency:
  group: igae-pipeline         # nunca dos corridas a la vez (evita conflictos al hacer push)
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar el CSV de INEGI (si ya salió el mes nuevo)
        env:
          IGAE_URL: ${{ vars.IGAE_URL }}      # opcional: solo si INEGI cambia la URL
          URL_CSV: ${{ inputs.url_csv }}
          EVENTO: ${{ github.event_name }}
        run: |
          ARGS="--salida data"
          if [ "$EVENTO" = "schedule" ]; then ARGS="$ARGS --solo-ventana"; fi   # a mano siempre consulta
          if [ -n "$URL_CSV" ]; then ARGS="$ARGS --url $URL_CSV"; fi
          python fetch_inegi.py $ARGS

      - name: Generar reportes y dashboard
        id: pipeline
        env:
          MESES_ATRAS: ${{ inputs.meses_atras || '24' }}
          REGENERAR: ${{ inputs.regenerar_todo }}
        run: |
          ARGS="--meses-atras $MESES_ATRAS"
          if [ "$REGENERAR" = "true" ]; then ARGS="$ARGS --regenerar-todo"; fi
          python run_pipeline.py $ARGS

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name  "igae-bot"
          git config user.email "igae-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios: no hay datos nuevos."
          else
            git commit -m "IGAE: datos hasta ${{ steps.pipeline.outputs.periodo }}"
            git pull --rebase origin "${{ github.ref_name }}"   # por si alguien subió algo mientras corría
            git push
          fi

      - name: Avisar a los suscriptores (correo con el reporte)
        if: steps.pipeline.outputs.nuevo_periodo == 'true' || inputs.reenviar_aviso || inputs.correo_prueba
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          PRUEBA: ${{ inputs.correo_prueba }}
          REENVIAR: ${{ inputs.reenviar_aviso }}
        run: |
          ARGS=""
          if [ "$PRUEBA" = "true" ]; then ARGS="--prueba"; fi
          if [ "$REENVIAR" = "true" ]; then ARGS="$ARGS --forzar"; fi
          python notificar.py $ARGS
